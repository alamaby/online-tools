name: Instagram Extract

# Triggered from the web UI (instagram-extractor/index.html) via the GitHub API.
# It opens the public post in a real headless browser (no login), reads the
# caption and downloads every slide, then commits the result so the UI can
# read it back from raw.githubusercontent.com.
on:
  workflow_dispatch:
    inputs:
      post_url:
        description: "Instagram post URL (public post, e.g. https://www.instagram.com/p/XXXX/)"
        required: true
        type: string
      job_id:
        description: "Job ID generated by the web UI (used as the results folder name)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        working-directory: instagram-extractor
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Extract post
        id: extract
        working-directory: instagram-extractor
        run: node extract.mjs --url "${{ inputs.post_url }}" --job "${{ inputs.job_id }}" --out "results/${{ inputs.job_id }}"

      # Always commit, even when extraction failed: result.json then carries
      # the error so the web UI can show it instead of hanging.
      - name: Commit results
        if: always()
        run: |
          git config user.name "instagram-extractor"
          git config user.email "actions@github.com"
          git add "instagram-extractor/results/${{ inputs.job_id }}" || true
          git diff --cached --quiet || git commit -m "Extract ${{ inputs.job_id }} from ${{ inputs.post_url }}"
          git push
